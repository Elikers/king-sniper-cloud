name: Add or remove markets

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        options: [add, remove]
        default: add
      markets:
        description: 'Markets, separated by commas. Example: DOGEUSDC.P, SUI, kPEPE'
        required: true

permissions:
  contents: write

concurrency:
  group: king-sniper-markets
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Edit symbols.txt
        env:
          ACTION: ${{ inputs.action }}
          MARKETS: ${{ inputs.markets }}
        run: node server/markets.js "$ACTION" "$MARKETS"
      - name: Save the change
        env:
          ACTION: ${{ inputs.action }}
          MARKETS: ${{ inputs.markets }}
        run: |
          if git diff --quiet; then echo "No change to save."; exit 0; fi
          git config user.name "king-sniper-bot"
          git config user.email "king-sniper-bot@users.noreply.github.com"
          git add symbols.txt
          git commit -m "Markets: $ACTION $MARKETS"
          git push
